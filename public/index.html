<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARVO AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050509;
  --bg2:#090912;
  --panel:rgba(255,255,255,.055);
  --panel2:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.13);
  --border2:rgba(255,255,255,.20);
  --text:#f7f7fa;
  --muted:#92929d;
  --purple:#9b6cff;
  --purple2:#7045d5;
  --shadow:rgba(0,0,0,.48);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 80% 0%,rgba(137,83,255,.23),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(112,65,220,.16),transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 50%),
    var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  transition:background .35s ease,color .35s ease;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.025),
      transparent 35%,
      rgba(155,108,255,.025)
    );
  z-index:-1;
}

button,
textarea,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ================================
   APP
================================ */

.app{
  height:100vh;
  display:flex;
}

/* ================================
   SIDEBAR
================================ */

.sidebar{
  width:270px;
  padding:18px;
  display:flex;
  flex-direction:column;
  border-right:1px solid rgba(255,255,255,.09);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );
  backdrop-filter:blur(40px) saturate(160%);
  -webkit-backdrop-filter:blur(40px) saturate(160%);
  box-shadow:
    10px 0 50px rgba(0,0,0,.18),
    inset -1px 0 0 rgba(255,255,255,.035);
  z-index:50;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 5px 22px;
}

.logo-icon,
.welcome-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#fff;
  background:
    linear-gradient(
      145deg,
      #d6c2ff,
      #8b5cf6 45%,
      #4c24b9
    );
  border:1px solid rgba(255,255,255,.30);
  box-shadow:
    0 15px 50px rgba(120,70,255,.30),
    inset 0 1px 0 rgba(255,255,255,.45);
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:13px;
}

.logo-name{
  font-size:19px;
  font-weight:700;
  letter-spacing:-.3px;
}

.new-chat{
  width:100%;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
  color:white;
  text-align:left;
  transition:.2s;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 10px 30px rgba(0,0,0,.12);
}

.new-chat:hover{
  background:rgba(155,108,255,.14);
  border-color:rgba(155,108,255,.35);
  transform:translateY(-1px);
}

.new-chat span{
  color:#c7aaff;
  font-size:18px;
  margin-right:7px;
}

.history-title{
  margin:27px 7px 10px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:#777783;
}

.history{
  flex:1;
  overflow:auto;
}

.history-item{
  padding:10px;
  margin-bottom:4px;
  border-radius:11px;
  color:#aaaab5;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:.2s;
}

.history-item:hover{
  background:rgba(255,255,255,.055);
  color:white;
}

.sidebar-bottom{
  border-top:1px solid rgba(255,255,255,.07);
  padding-top:10px;
}

.sidebar-btn{
  width:100%;
  padding:10px;
  background:none;
  border:0;
  color:#9999a5;
  text-align:left;
  border-radius:10px;
}

.sidebar-btn:hover{
  background:rgba(255,255,255,.055);
  color:white;
}

/* ================================
   MAIN
================================ */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ================================
   TOPBAR
================================ */

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.075);
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.018)
    );
  backdrop-filter:blur(35px) saturate(160%);
  -webkit-backdrop-filter:blur(35px) saturate(160%);
  box-shadow:
    0 10px 40px rgba(0,0,0,.12),
    inset 0 -1px 0 rgba(255,255,255,.025);
  z-index:10;
}

.mobile-menu{
  display:none;
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:20px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

/* ================================
   THEME
================================ */

.theme-buttons{
  display:flex;
  align-items:center;
  gap:7px;
}

.theme-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
  color:#fff;
  font-size:16px;
  transition:.25s;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 7px 25px rgba(0,0,0,.10);
}

.theme-btn:hover{
  background:rgba(155,108,255,.16);
  border-color:rgba(155,108,255,.35);
  transform:translateY(-1px);
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aaa;
  font-size:12px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(18px);
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#65d991;
  box-shadow:0 0 12px #65d991;
}

/* ================================
   CHAT
================================ */

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 20px 160px;
}

.chat-inner{
  max-width:850px;
  margin:auto;
}

/* ================================
   WELCOME
================================ */

.welcome{
  min-height:65vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  animation:fadeIn .45s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.welcome-icon{
  width:76px;
  height:76px;
  border-radius:25px;
  font-size:29px;
  margin-bottom:24px;
}

.welcome h1{
  font-size:42px;
  letter-spacing:-1.8px;
  margin-bottom:10px;
}

.welcome p{
  max-width:520px;
  color:var(--muted);
  line-height:1.7;
  font-size:15px;
}

/* ================================
   MESSAGE
================================ */

.message{
  display:flex;
  margin:19px 0;
  animation:messageIn .22s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.bubble{
  max-width:min(78%,720px);
  padding:14px 17px;
  border-radius:19px;
  line-height:1.65;
  font-size:14px;
  word-wrap:break-word;
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 12px 40px rgba(0,0,0,.10);
}

.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(155,108,255,.23),
      rgba(112,67,210,.11)
    );
  border:1px solid rgba(155,108,255,.30);
  border-bottom-right-radius:6px;
}

.ai .bubble{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );
  border:1px solid rgba(255,255,255,.10);
  border-bottom-left-radius:6px;
}

/* ================================
   MARKDOWN
================================ */

.bubble p{
  margin:5px 0;
}

.bubble h1,
.bubble h2,
.bubble h3{
  margin:12px 0 8px;
  line-height:1.3;
}

.bubble h1{font-size:22px}
.bubble h2{font-size:19px}
.bubble h3{font-size:16px}

.bubble ul,
.bubble ol{
  padding-left:22px;
  margin:8px 0;
}

.bubble li{
  margin:4px 0;
}

.bubble strong{
  color:white;
}

.bubble code{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  padding:2px 6px;
  border-radius:6px;
}

/* ================================
   CODE
================================ */

.code-wrap{
  margin:12px 0;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  overflow:hidden;
  background:rgba(0,0,0,.4);
}

.code-top{
  height:36px;
  padding:0 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#888;
  font-size:11px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.code-copy{
  padding:5px 8px;
  border-radius:7px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);
  color:#999;
}

.code-wrap pre{
  margin:0;
  padding:14px;
  overflow-x:auto;
}

.code-wrap pre code{
  background:none;
  border:0;
  padding:0;
  color:#ddd;
  font-family:Consolas,monospace;
  font-size:12px;
}

/* ================================
   TABLE
================================ */

.md-table{
  width:100%;
  border-collapse:collapse;
  margin:12px 0;
  font-size:12px;
}

.md-table th,
.md-table td{
  border:1px solid rgba(255,255,255,.09);
  padding:8px;
  text-align:left;
}

.md-table th{
  background:rgba(155,108,255,.11);
}

/* ================================
   IMAGE
================================ */

.generated-image{
  display:block;
  max-width:100%;
  border-radius:15px;
  margin-top:8px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}

/* ================================
   TYPING
================================ */

.typing{
  display:flex;
  gap:5px;
  height:20px;
  align-items:center;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#aaa;
  animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* ================================
   ACTIONS
================================ */

.message-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.copy-msg,
.regenerate-msg,
.voice-msg{
  padding:5px 8px;
  border-radius:7px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
  color:#777783;
  font-size:11px;
}

.copy-msg:hover,
.regenerate-msg:hover,
.voice-msg:hover{
  color:white;
  background:rgba(255,255,255,.07);
}

/* ================================
   COMPOSER
================================ */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:20px;
  background:
    linear-gradient(
      to top,
      rgba(5,5,9,1) 18%,
      rgba(5,5,9,.88) 55%,
      transparent
    );
  z-index:15;
}

.composer{
  max-width:850px;
  margin:auto;
  padding:8px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  border-radius:21px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.035)
    );
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(40px) saturate(170%);
  -webkit-backdrop-filter:blur(40px) saturate(170%);
  box-shadow:
    0 25px 90px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 0 1px rgba(255,255,255,.025);
}

textarea{
  flex:1;
  min-height:44px;
  max-height:180px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:white;
  font-size:14px;
  line-height:1.5;
  padding:12px 8px;
}

textarea::placeholder{
  color:#777783;
}

.icon-btn,
.send-btn{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:13px;
}

.icon-btn{
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.045);
  color:#aaa;
  font-size:18px;
  backdrop-filter:blur(15px);
}

.icon-btn:hover{
  color:white;
  background:rgba(155,108,255,.12);
}

.send-btn{
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(145deg,#a477ff,#7044d6);
  color:white;
  font-size:17px;
  box-shadow:
    0 8px 28px rgba(120,70,230,.27),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.send-btn.stop{
  background:linear-gradient(145deg,#eee,#85858e);
  color:#111;
}

/* ================================
   UPLOAD
================================ */

.upload-preview{
  max-width:850px;
  margin:0 auto 8px;
  display:none;
  position:relative;
}

.upload-preview img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
}

.remove-upload{
  position:absolute;
  left:58px;
  top:-7px;
  width:21px;
  height:21px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:#222;
  color:white;
}

/* ================================
   AUTH OVERLAY
================================ */

.auth-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(125,70,255,.22),
      transparent 38%
    ),
    rgba(0,0,0,.62);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:200;
}

.auth-card{
  width:min(430px,100%);
  padding:30px;
  border-radius:28px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.115),
      rgba(255,255,255,.045)
    );
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 35px 100px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.14);
  backdrop-filter:blur(45px) saturate(170%);
  -webkit-backdrop-filter:blur(45px) saturate(170%);
  animation:authIn .35s ease;
}

@keyframes authIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.auth-logo{
  width:58px;
  height:58px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:19px;
  font-size:24px;
  font-weight:800;
  color:#fff;
  background:linear-gradient(145deg,#cdb6ff,#6036cf);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:
    0 15px 45px rgba(120,70,255,.28),
    inset 0 1px 0 rgba(255,255,255,.4);
}

.auth-card h2{
  text-align:center;
  font-size:25px;
  margin-bottom:7px;
  letter-spacing:-.5px;
}

.auth-subtitle{
  text-align:center;
  color:#9999a5;
  font-size:13px;
  margin-bottom:23px;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.auth-input{
  width:100%;
  height:48px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:rgba(255,255,255,.055);
  color:white;
  padding:0 14px;
  font-size:14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05);
}

.auth-input:focus{
  border-color:rgba(155,108,255,.55);
  box-shadow:
    0 0 0 3px rgba(155,108,255,.09),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.auth-input::placeholder{
  color:#777783;
}

.auth-submit{
  height:48px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  color:white;
  font-weight:600;
  background:linear-gradient(145deg,#a477ff,#7044d6);
  box-shadow:
    0 12px 30px rgba(120,70,230,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
  transition:.2s;
}

.auth-submit:hover{
  transform:translateY(-1px);
  box-shadow:
    0 16px 38px rgba(120,70,230,.32),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.auth-switch{
  margin-top:17px;
  text-align:center;
  color:#9999a5;
  font-size:13px;
}

.auth-link{
  border:0;
  background:none;
  color:#b998ff;
  font-weight:600;
  margin-left:4px;
}

.auth-link:hover{
  text-decoration:underline;
}

.auth-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:19px 0;
  color:#666672;
  font-size:11px;
}

.auth-divider::before,
.auth-divider::after{
  content:"";
  height:1px;
  flex:1;
  background:rgba(255,255,255,.09);
}

.guest-btn{
  width:100%;
  height:45px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.045);
  color:#bdbdc7;
  transition:.2s;
}

.guest-btn:hover{
  color:white;
  background:rgba(255,255,255,.075);
  border-color:rgba(255,255,255,.19);
}

.auth-error{
  min-height:17px;
  color:#ff8d9d;
  text-align:center;
  font-size:12px;
  margin-top:8px;
}

/* ================================
   USER ACCOUNT
================================ */

.user-account{
  display:none;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);
  color:#aaa;
  font-size:11px;
}

.user-account.active{
  display:flex;
}

.user-avatar{
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(145deg,#a477ff,#7044d6);
  color:white;
  font-size:10px;
  font-weight:700;
}

/* ================================
   LIGHT MODE
================================ */

body.light{
  --bg:#edf1f7;
  --bg2:#e7ecf4;
  --panel:rgba(255,255,255,.42);
  --panel2:rgba(255,255,255,.58);
  --border:rgba(255,255,255,.72);
  --text:#191923;
  --muted:#686875;

  background:
    radial-gradient(
      circle at 80% 5%,
      rgba(155,108,255,.23),
      transparent 31%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(112,65,220,.13),
      transparent 31%
    ),
    linear-gradient(
      135deg,
      #eef2f7,
      #e7ecf4
    );

  color:var(--text);
}

body.light .sidebar{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.58),
      rgba(255,255,255,.31)
    );
  border-right:1px solid rgba(255,255,255,.78);
  box-shadow:8px 0 35px rgba(50,60,90,.07);
}

body.light .topbar{
  background:rgba(255,255,255,.38);
  border-bottom:1px solid rgba(255,255,255,.70);
}

body.light .new-chat,
body.light .status,
body.light .theme-btn,
body.light .icon-btn,
body.light .composer,
body.light .ai .bubble{
  background:

<body>

<!-- ================================
     AUTH
================================ -->

<div class="auth-overlay" id="authOverlay">

  <div class="auth-card">

    <div class="auth-logo">A</div>

    <h2 id="authTitle">Welcome to ARVO AI</h2>

    <div class="auth-subtitle" id="authSubtitle">
      Sign in to continue with ARVO AI
    </div>

    <form class="auth-form" id="authForm">

      <input
        class="auth-input"
        id="authName"
        type="text"
        placeholder="Your name"
        autocomplete="name"
        style="display:none;"
      >

      <input
        class="auth-input"
        id="authEmail"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        class="auth-input"
        id="authPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        class="auth-submit"
        id="authSubmit"
        type="submit"
      >
        Login
      </button>

    </form>

    <div
      class="auth-error"
      id="authError"
    ></div>

    <div class="auth-switch">

      <span id="authSwitchText">
        Don't have an account?
      </span>

      <button
        class="auth-link"
        id="authSwitchBtn"
        type="button"
      >
        Sign Up
      </button>

    </div>

    <div class="auth-divider">
      OR
    </div>

    <button
      class="guest-btn"
      id="guestBtn"
      type="button"
    >
      Continue as Guest
    </button>

  </div>

</div>


<!-- ================================
     APP
================================ -->

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">

      <div class="logo-icon">
        A
      </div>

      <div class="logo-name">
        ARVO AI
      </div>

    </div>

    <button
      class="new-chat"
      id="newChatBtn"
    >
      <span>＋</span>
      New chat
    </button>

    <div class="history-title">
      Recent
    </div>

    <div
      class="history"
      id="history"
    ></div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-btn"
        id="clearBtn"
      >
        🗑 Clear history
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        id="menuBtn"
      >
        ☰
      </button>

      <div></div>

      <div class="top-actions">

        <div
          class="user-account"
          id="userAccount"
        >
          <span
            class="user-avatar"
            id="userAvatar"
          >
            U
          </span>

          <span id="userNameDisplay">
            User
          </span>
        </div>

        <div class="theme-buttons">

          <button
            id="darkModeBtn"
            class="theme-btn"
            title="Dark Mode"
          >
            🌙
          </button>

          <button
            id="lightModeBtn"
            class="theme-btn"
            title="Light Mode"
          >
            ☀️
          </button>

        </div>

        <div class="status">

          <span class="status-dot"></span>

          <span>
            Online
          </span>

        </div>

      </div>

    </header>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="chat-inner"
        id="chatInner"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-icon">
            A
          </div>

          <h1>
            How can I help?
          </h1>

          <p>
            Ask ARVO anything — coding, mathematics,
            ideas, writing, explanations and more.
          </p>

        </div>

      </div>

    </section>


    <!-- COMPOSER -->

    <div class="composer-area">

      <div
        class="upload-preview"
        id="uploadPreview"
      >

        <img
          id="previewImage"
        >

        <button
          class="remove-upload"
          id="removeUpload"
        >
          ×
        </button>

      </div>


      <div class="composer">

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          hidden
        >

        <button
          class="icon-btn"
          id="uploadBtn"
          title="Upload image"
        >
          ＋
        </button>

        <button
          class="icon-btn"
          id="imageBtn"
          title="Generate image"
        >
          ✦
        </button>

        <textarea
          id="input"
          placeholder="Message ARVO AI..."
          rows="1"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>


<script>

/* =================================
   ELEMENTS
================================= */

const input =
  document.getElementById("input");

const chat =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const historyBox =
  document.getElementById("history");

const sendBtn =
  document.getElementById("sendBtn");

const imageInput =
  document.getElementById("imageInput");

const uploadBtn =
  document.getElementById("uploadBtn");

const imageBtn =
  document.getElementById("imageBtn");

const uploadPreview =
  document.getElementById("uploadPreview");

const previewImage =
  document.getElementById("previewImage");

const removeUpload =
  document.getElementById("removeUpload");

const newChatBtn =
  document.getElementById("newChatBtn");

const clearBtn =
  document.getElementById("clearBtn");

const menuBtn =
  document.getElementById("menuBtn");

const darkModeBtn =
  document.getElementById("darkModeBtn");

const lightModeBtn =
  document.getElementById("lightModeBtn");


/* AUTH */

const authOverlay =
  document.getElementById("authOverlay");

const authForm =
  document.getElementById("authForm");

const authTitle =
  document.getElementById("authTitle");

const authSubtitle =
  document.getElementById("authSubtitle");

const authName =
  document.getElementById("authName");

const authEmail =
  document.getElementById("authEmail");

const authPassword =
  document.getElementById("authPassword");

const authSubmit =
  document.getElementById("authSubmit");

const authError =
  document.getElementById("authError");

const authSwitchText =
  document.getElementById("authSwitchText");

const authSwitchBtn =
  document.getElementById("authSwitchBtn");

const guestBtn =
  document.getElementById("guestBtn");

const userAccount =
  document.getElementById("userAccount");

const userAvatar =
  document.getElementById("userAvatar");

const userNameDisplay =
  document.getElementById("userNameDisplay");


/* =================================
   STATE
================================= */

let messages = [];
let historyTitles = [];
let currentController = null;
let uploadedImage = null;

let authMode = "login";


/* =================================
   AUTH MODE
================================= */

function showLogin(){

  authMode = "login";

  authTitle.textContent =
    "Welcome to ARVO AI";

  authSubtitle.textContent =
    "Sign in to continue with ARVO AI";

  authName.style.display =
    "none";

  authName.required =
    false;

  authEmail.placeholder =
    "Email address";

  authPassword.placeholder =
    "Password";

  authSubmit.textContent =
    "Login";

  authSwitchText.textContent =
    "Don't have an account?";

  authSwitchBtn.textContent =
    "Sign Up";

  authError.textContent =
    "";

}

function showSignup(){

  authMode = "signup";

  authTitle.textContent =
    "Create your ARVO account";

  authSubtitle.textContent =
    "Create an account and start using ARVO AI";

  authName.style.display =
    "block";

  authName.required =
    true;

  authEmail.placeholder =
    "Email address";

  authPassword.placeholder =
    "Create password";

  authSubmit.textContent =
    "Create Account";

  authSwitchText.textContent =
    "Already have an account?";

  authSwitchBtn.textContent =
    "Login";

  authError.textContent =
    "";

}

authSwitchBtn.onclick = () => {

  if(authMode === "login"){

    showSignup();

  }else{

    showLogin();

  }

};


function setLoggedIn(user){

  authOverlay.style.display =
    "none";

  if(!user)
    return;

  userAccount.classList.add(
    "active"
  );

  const name =
    user.name ||
    user.email ||
    "User";

  userNameDisplay.textContent =
    name;

  userAvatar.textContent =
    name
      .charAt(0)
      .toUpperCase();

}


function setGuest(){

  authOverlay.style.display =
    "none";

  userAccount.classList.remove(
    "active"
  );

}


function getToken(){

  return localStorage.getItem(
    "arvoToken"
  );

}


function getSavedUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "arvoUser"
      )
    );

  }catch{

    return null;

  }

}


function saveAuth(token,user){

  if(token){

    localStorage.setItem(
      "arvoToken",
      token
    );

  }

  if(user){

    localStorage.setItem(
      "arvoUser",
      JSON.stringify(user)
    );

  }

}


function clearAuth(){

  localStorage.removeItem(
    "arvoToken"
  );

  localStorage.removeItem(
    "arvoUser"
  );

}


async function checkExistingLogin(){

  const token =
    getToken();

  const savedUser =
    getSavedUser();

  if(token && savedUser){

    setLoggedIn(savedUser);

  }else{

    showLogin();

  }

}


authForm.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    authError.textContent =
      "";

    const email =
      authEmail.value.trim();

    const password =
      authPassword.value;

    const name =
      authName.value.trim();

    if(!email || !password){

      authError.textContent =
        "Please enter your email and password.";

      return;

    }

    if(
      authMode === "signup" &&
      !name
    ){

      authError.textContent =
        "Please enter your name.";

      return;

    }

    authSubmit.disabled =
      true;

    authSubmit.textContent =
      authMode === "login"
      ? "Logging in..."
      : "Creating account...";

    try{

      const endpoint =
        authMode === "login"
        ? "/api/login"
        : "/api/signup";

      const body =
        authMode === "login"
        ? {
            email,
            password
          }
        : {
            name,
            email,
            password
          };

      const response =
        await fetch(
          endpoint,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)

          }
        );

      let data = {};

      try{

        data =
          await response.json();

      }catch{

        data = {};

      }

      if(!response.ok){

        throw new Error(
          data.error ||
          "Authentication failed."
        );

      }

      if(!data.token){

        throw new Error(
          "Login server did not return a token."
        );

      }

      saveAuth(
        data.token,
        data.user
      );

      setLoggedIn(
        data.user
      );

    }catch(error){

      console.error(error);

      authError.textContent =
        error.message ||
        "Something went wrong.";

    }finally{

      authSubmit.disabled =
        false;

      authSubmit.textContent =
        authMode === "login"
        ? "Login"
        : "Create Account";

    }

  }
);


guestBtn.onclick = () => {

  clearAuth();

  setGuest();

};


/* =================================
   DARK / LIGHT MODE
================================= */

function setTheme(theme){

  if(theme === "light"){

    document.body.classList.add(
      "light"
    );

    localStorage.setItem(
      "arvoTheme",
      "light"
    );

  }else{

    document.body.classList.remove(
      "light"
    );

    localStorage.setItem(
      "arvoTheme",
      "dark"
    );

  }

}

const savedTheme =
  localStorage.getItem(
    "arvoTheme"
  ) || "dark";

setTheme(savedTheme);

darkModeBtn.onclick = () => {

  setTheme("dark");

};

lightModeBtn.onclick = () => {

  setTheme("light");

};


/* =================================
   STORAGE
================================= */

function saveMessages(){

  localStorage.setItem(
    "arvoMessages",
    JSON.stringify(messages)
  );

}

function loadMessages(){

  try{

    const saved =
      localStorage.getItem(
        "arvoMessages"
      );

    messages =
      saved
      ? JSON.parse(saved)
      : [];

  }catch{

    messages = [];

  }

}

function saveHistory(){

  localStorage.setItem(
    "arvoHistory",
    JSON.stringify(historyTitles)
  );

}

function loadHistory(){

  try{

    const saved =
      localStorage.getItem(
        "arvoHistory"
      );

    historyTitles =
      saved
      ? JSON.parse(saved)
      : [];

  }catch{

    historyTitles = [];

  }

  renderHistory();

}


/* =================================
   INITIAL LOAD
================================= */

loadMessages();
loadHistory();

if(messages.length){

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome)
    welcome.remove();

  messages.forEach(msg => {

    addMessage(
      msg.content,
      msg.role === "user"
        ? "user"
        : "ai",
      msg.image || null,
      false,
      false
    );

  });

}


/* =================================
   HISTORY
================================= */

function addHistory(title){

  if(!title)
    return;

  title =
    title
      .replace(/\s+/g," ")
      .trim();

  if(!title)
    return;

  historyTitles =
    historyTitles.filter(
      x => x !== title
    );

  historyTitles.push(title);

  historyTitles =
    historyTitles.slice(-20);

  saveHistory();
  renderHistory();

}


function renderHistory(){

  historyBox.innerHTML =
    "";

  [...historyTitles]
    .reverse()
    .forEach(title => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        title;

      item.onclick = () => {

        input.value =
          title;

        input.focus();

        document
          .getElementById(
            "sidebar"
          )
          .classList.remove(
            "open"
          );

      };

      historyBox.appendChild(
        item
      );

    });

}


/* =================================
   NEW CHAT
================================= */

function newChat(){

  if(currentController){

    currentController.abort();

    currentController =
      null;

  }

  messages = [];

  saveMessages();

  chatInner.innerHTML =
    "";

  chatInner.appendChild(
    createWelcome()
  );

  input.value =
    "";

  input.style.height =
    "auto";

  removeImage();

  resetSendButton();

}


/* =================================
   WELCOME
================================= */

function createWelcome(){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "welcome";

  div.id =
    "welcome";

  div.innerHTML = `

    <div class="welcome-icon">
      A
    </div>

    <h1>
      How can I help?
    </h1>

    <p>
      Ask ARVO anything — coding,
      mathematics, ideas, writing,
      explanations and more.
    </p>

  `;

  return div;

}


/* =================================
   CLEAR HISTORY
================================= */

function clearHistory(){

  if(
    !confirm(
      "Clear ARVO AI conversation history?"
    )
  )
    return;

  messages = [];
  historyTitles = [];

  localStorage.removeItem(
    "arvoMessages"
  );

  localStorage.removeItem(
    "arvoHistory"
  );

  renderHistory();

  newChat();

}


/* =================================
   INPUT
================================= */

input.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      if(currentController){

        stopGeneration();

      }else{

        sendMessage();

      }

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";

  }
);


/* =================================
   UPLOAD
================================= */

uploadBtn.onclick = () => {

  imageInput.click();

};


imageInput.onchange = () => {

  const file =
    imageInput.files[0];

  if(!file)
    return;

  const reader =
    new FileReader();

  reader.onload = e => {

    uploadedImage =
      e.target.result;

    previewImage.src =
      uploadedImage;

    uploadPreview.style.display =
      "block";

  };

  reader.readAsDataURL(file);

};


removeUpload.onclick =
  removeImage;


function removeImage(){

  uploadedImage =
    null;

  imageInput.value =
    "";

  uploadPreview.style.display =
    "none";

}


/* =================================
   TYPING
================================= */

function createTyping(){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";

  message.innerHTML = `

    <div class="bubble">

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

  `;

  chatInner.appendChild(
    message
  );

  scrollChat();

  return message;

}


/* =================================
   AUTH HEADERS
================================= */

function getAuthHeaders(){

  const headers = {
    "Content-Type":
      "application/json"
  };

  const token =
    getToken();

  if(token){

    headers.Authorization =
      "Bearer " + token;

  }

  return headers;

}


/* =================================
   SEND
================================= */

async function sendMessage(){

  if(currentController)
    return;

  const text =
    input.value.trim();

  if(
    !text &&
    !uploadedImage
  )
    return;

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome)
    welcome.remove();

  const image =
    uploadedImage;

  addMessage(
    text ||
    "Analyze this image.",
    "user",
    image,
    false,
    true
  );

  messages.push({

    role:"user",

    content:
      text ||
      "Analyze this image.",

    image:
      image || null

  });

  saveMessages();

  addHistory(
    text ||
    "Image analysis"
  );

  input.value =
    "";

  input.style.height =
    "auto";

  removeImage();

  currentController =
    new AbortController();

  setStopButton();

  const loading =
    createTyping();

  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:
            getAuthHeaders(),

          body:
            JSON.stringify({

              message:
                text,

              history:
                getModelHistory()

            }),

          signal:
            currentController.signal

        }
      );

    if(!response.ok){

      throw new Error(
        "Server error"
      );

    }

    const data =
      await response.json();

    loading.remove();

    if(data.answer){

      addMessage(
        data.answer,
        "ai",
        null,
        true,
        true
      );

      messages.push({

        role:"assistant",

        content:
          data.answer

      });

      saveMessages();

    }else{

      addMessage(
        "Sorry, I couldn't generate a response.",
        "ai"
      );

    }

  }catch(error){

    loading.remove();

    if(
      error.name ===
      "AbortError"
    ){

      return;

    }

    console.error(error);

    addMessage(
      "Connection error. Make sure ARVO AI server is running.",
      "ai"
    );

  }finally{

    currentController =
      null;

    resetSendButton();

  }

}


/* =================================
   MODEL HISTORY
================================= */

function getModelHistory(){

  return messages

    .filter(
      msg =>
        (
          msg.role === "user" ||
          msg.role === "assistant"
        ) &&
        typeof msg.content ===
        "string"
    )

    .slice(-20)

    .map(msg => ({

      role:
        msg.role,

      content:
        msg.content

    }));

}


/* =================================
   STOP
================================= */

function stopGeneration(){

  if(!currentController)
    return;

  currentController.abort();

  currentController =
    null;

  resetSendButton();

}


function setStopButton(){

  sendBtn.classList.add(
    "stop"
  );

  sendBtn.textContent =
    "■";

}


function resetSendButton(){

  sendBtn.classList.remove(
    "stop"
  );

  sendBtn.textContent =
    "↑";

}


/* =================================
   SEND BUTTON
================================= */

sendBtn.onclick = () => {

  if(currentController){

    stopGeneration();

  }else{

    sendMessage();

  }

};


/* =================================
   ADD MESSAGE
================================= */

function addMessage(
  text,
  type,
  image = null,
  actions = false,
  scroll = true
){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  if(type === "ai"){

    bubble.innerHTML =
      renderMarkdown(text);

  }else{

    bubble.textContent =
      text;

  }

  if(image){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      image;

    img.className =
      "generated-image";

    bubble.appendChild(
      img
    );

  }

  message.appendChild(
    bubble
  );

  if(
    type === "ai" &&
    actions
  ){

    const actionBar =
      document.createElement(
        "div"
      );

    actionBar.className =
      "message-actions";


    /* COPY */

    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "copy-msg";

    copy.textContent =
      "Copy";

    copy.onclick =
      async () => {

        try{

          await navigator.clipboard.writeText(
            text
          );

          copy.textContent =
            "Copied ✓";

          setTimeout(
            () =>
              copy.textContent =
                "Copy",
            1500
          );

        }catch{

          copy.textContent =
            "Copy failed";

        }

      };


    /* REGENERATE */

    const regenerate =
      document.createElement(
        "button"
      );

    regenerate.className =
      "regenerate-msg";

    regenerate.textContent =
      "↻ Regenerate";

    regenerate.onclick =
      () =>
        regenerateResponse(
          regenerate
        );


    /* VOICE */

    const voice =
      document.createElement(
        "button"
      );

    voice.className =
      "voice-msg";

    voice.textContent =
      "🔊 Voice";

    voice.onclick =
      () => {

        speakText(text);

      };


    actionBar.appendChild(
      copy
    );

    actionBar.appendChild(
      regenerate
    );

    actionBar.appendChild(
      voice
    );

    bubble.appendChild(
      actionBar
    );

  }

  chatInner.appendChild(
    message
  );

  if(scroll)
    scrollChat();

  return message;

}


/* =================================
   REGENERATE
================================= */

async function regenerateResponse(
  button
){

  if(currentController)
    return;

  const userMessages =
    messages.filter(
      x => x.role === "user"
    );

  if(!userMessages.length)
    return;

  const last =
    userMessages[
      userMessages.length - 1
    ];

  button.textContent =
    "Generating...";

  currentController =
    new AbortController();

  setStopButton();

  const loading =
    createTyping();

  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:
            getAuthHeaders(),

          body:
            JSON.stringify({

              message:
                last.content,

              history:
                getModelHistory()

            }),

          signal:
            currentController.signal

        }
      );

    if(!response.ok)
      throw new Error();

    const data =
      await response.json();

    loading.remove();

    if(data.answer){

      addMessage(
        data.answer,
        "ai",
        null,
        true,
        true
      );

      messages.push({

        role:"assistant",

        content:
          data.answer

      });

      saveMessages();

    }

  }catch(error){

    loading.remove();

    if(
      error.name !==
      "AbortError"
    ){

      addMessage(
        "Regeneration failed.",
        "ai"
      );

    }

  }finally{

    currentController =
      null;

    resetSendButton();

    button.textContent =
      "↻ Regenerate";

  }

}


/* =================================
   VOICE
================================= */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  )
    return;

  speechSynthesis.cancel();

  const clean =
    text
      .replace(
        /```[\s\S]*?```/g,
        ""
      )
      .replace(
        /[\*#\_`]/g,
        ""
      );

  const speech =
    new SpeechSynthesisUtterance(
      clean
    );

  speech.rate =
    1;

  speech.pitch =
    1;

  speechSynthesis.speak(
    speech
  );

}


/* =================================
   MARKDOWN
================================= */

function escapeHTML(text){

  return text
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


function inlineMarkdown(text){

  text =
    escapeHTML(text);

  text =
    text.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  text =
    text.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );

  text =
    text.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  return text;

}


function renderMarkdown(text){

  const lines =
    text.split("\n");

  let html = "";

  let code =
    false;

  let language =
    "";

  let codeText =
    "";

  let list =
    null;


  function closeList(){

    if(list){

      html +=
        list === "ol"
        ? "</ol>"
        : "</ul>";

      list =
        null;

    }

  }


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    /* CODE */

    if(
      line.trim()
        .startsWith("```")
    ){

      if(!code){

        closeList();

        code =
          true;

        language =
          line
            .trim()
            .replace(
              "```",
              ""
            )
            .trim() ||
          "code";

        codeText =
          "";

      }else{

        code =
          false;

        html += `

          <div class="code-wrap">

            <div class="code-top">

              <span>
                ${escapeHTML(language)}
              </span>

              <button
                class="code-copy"
                onclick="copyCode(this)"
              >
                Copy
              </button>

            </div>

            <pre><code>${escapeHTML(
              codeText
            )}</code></pre>

          </div>

        `;

      }

      continue;

    }


    if(code){

      codeText +=
        line + "\n";

      continue;

    }


    /* HEADINGS */

    if(
      line.startsWith("### ")
    ){

      closeList();

      html +=
        `<h3>${inlineMarkdown(
          line.slice(4)
        )}</h3>`;

      continue;

    }

    if(
      line.startsWith("## ")
    ){

      closeList();

      html +=
        `<h2>${inlineMarkdown(
          line.slice(3)
        )}</h2>`;

      continue;

    }

    if(
      line.startsWith("# ")
    ){

      closeList();

      html +=
        `<h1>${inlineMarkdown(
          line.slice(2)
        )}</h1>`;

      continue;

    }


    /* BULLETS */

    if(
      /^[-*]\s/.test(line)
    ){

      if(list !== "ul"){

        closeList();

        html +=
          "<ul>";

        list =
          "ul";

      }

      html +=
        `<li>${inlineMarkdown(
          line.replace(
            /^[-*]\s/,
            ""
          )
        )}</li>`;

      continue;

    }


    /* NUMBERED */

    if(
      /^\d+\.\s/.test(line)
    ){

      if(list !== "ol"){

        closeList();

        html +=
          "<ol>";

        list =
          "ol";

      }

      html +=
        `<li>${inlineMarkdown(
          line.replace(
            /^\d+\.\s/,
            ""
          )
        )}</li>`;

      continue;

    }

    closeList();


    /* EMPTY */

    if(!line.trim())
      continue;


    /* PARAGRAPH */

    html +=
      `<p>${inlineMarkdown(
        line
      )}</p>`;

  }

  closeList();

  return html;

}


/* =================================
   COPY CODE
================================= */

async function copyCode(button){

  const code =
    button
      .closest(".code-wrap")
      .querySelector("code")
      .textContent;

  try{

    await navigator.clipboard.writeText(
      code
    );

    button.textContent =
      "Copied ✓";

    setTimeout(
      () =>
        button.textContent =
          "Copy",
      1500
    );

  }catch{

    button.textContent =
      "Failed";

  }

}


/* =================================
   IMAGE GENERATION
================================= */

imageBtn.onclick =
  generateImage;


async function generateImage(){

  let prompt =
    input.value.trim();

  if(!prompt){

    prompt =
      window.prompt(
        "Describe the image you want ARVO AI to generate:"
      );

  }

  if(!prompt)
    return;

  prompt =
    prompt.trim();

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome)
    welcome.remove();

  addMessage(
    "Generate an image: " +
    prompt,
    "user"
  );

  addHistory(
    "Generate: " +
    prompt
  );

  input.value =
    "";

  input.style.height =
    "auto";

  const loading =
    createTyping();

  try{

    const response =
      await fetch(
        "/api/image",
        {

          method:"POST",

          headers:
            getAuthHeaders(),

          body:
            JSON.stringify({
              prompt
            })

        }
      );

    const data =
      await response.json();

    loading.remove();

    if(data.image){

      addMessage(
        "Here is your generated image:",
        "ai",
        data.image,
        false,
        true
      );

    }else{

      addMessage(
        data.error ||
        "Image generation failed.",
        "ai"
      );

    }

  }catch(error){

    loading.remove();

    addMessage(
      "Image generation failed. Check the server.",
      "ai"
    );

    console.error(error);

  }

}
